name: Web CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "web/**"
      - "deploy/**"
      - ".github/workflows/web-ci.yml"
      - "pyproject.toml"
      - "pa_agent/**"
  pull_request:
    paths:
      - "web/**"
      - "deploy/**"
      - ".github/workflows/web-ci.yml"
      - "pyproject.toml"
      - "pa_agent/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install -r web/backend/requirements.txt pytest
      - run: PYTHONPATH=web/backend pytest -q web/backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package.json
      - run: npm install
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
